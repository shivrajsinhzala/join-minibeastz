<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Mini Beastz</title>
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      margin: 0;
      padding: 0 20px;
    }
    h1 {
      color: #ff1744;
      font-size: 1.6rem;
      margin-bottom: 12px;
    }
    p {
      color: #ccc;
      font-size: 1rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    button {
      background: #ff1744;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #e60033;
    }
  </style>
</head>
<body>
  <div id="content">
    <h1>Join the Mini Beastz Crew 🚗🔥</h1>
    <p id="message">Redirecting to WhatsApp group…</p>
    <button id="openBtn" style="display:none;" onclick="window.location.href='https://chat.whatsapp.com/K361XhHhktJGUTsS6MSJRt'">
      Open in WhatsApp
    </button>
  </div>

  <script>
    const whatsappLink = "https://chat.whatsapp.com/K361XhHhktJGUTsS6MSJRt?utm_source=bio&utm_medium=link&utm_campaign=join_group";
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const inInstagram = ua.toLowerCase().includes("instagram");

    if (inInstagram) {
      document.getElementById("message").innerText =
        "Instagram blocks automatic redirects. Tap below to open directly in WhatsApp ⬇️";
      document.getElementById("openBtn").style.display = "inline-block";
    } else {
      window.location.replace(whatsappLink);
    }
  </script>
</body>
</html>
